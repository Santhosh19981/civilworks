<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/rentals" color="navy"></ion-back-button>
        </ion-buttons>
        <ion-title>Equipment Details</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div *ngIf="rental" class="fade-in">
        <div class="rental-hero">
            <img [src]="rental.image" [alt]="rental.name">
            <div class="hero-overlay">
                <h1>{{rental.name}}</h1>
                <div class="price-tag">
                    <span class="currency">₹</span>
                    <span class="amount">{{rental.pricePerDay}}</span>
                    <span class="unit">/day</span>
                </div>
            </div>
        </div>

        <div class="details-container ion-padding">
            <div class="section">
                <h2 class="section-title">
                    <ion-icon name="document-text-outline"></ion-icon>
                    Description
                </h2>
                <p class="description-text">{{rental.description}}</p>
            </div>

            <div class="section booking-form">
                <h2 class="section-title">
                    <ion-icon name="calendar-outline"></ion-icon>
                    Booking Details
                </h2>

                <div class="input-group">
                    <div class="label-info">
                        <span class="main-label">Rental Duration</span>
                        <span class="sub-label">Number of days</span>
                    </div>
                    <div class="selector">
                        <ion-button fill="clear" (click)="decrementDays()">
                            <ion-icon name="remove-circle-outline"></ion-icon>
                        </ion-button>
                        <span class="count">{{daysCount}}</span>
                        <ion-button fill="clear" (click)="incrementDays()">
                            <ion-icon name="add-circle-outline"></ion-icon>
                        </ion-button>
                    </div>
                </div>

                <div class="total-section">
                    <div class="total-row">
                        <span>Rate (per day)</span>
                        <span>₹{{rental.pricePerDay}}</span>
                    </div>
                    <div class="total-row">
                        <span>Duration</span>
                        <span>{{daysCount}} Days</span>
                    </div>
                    <hr>
                    <div class="total-row grand-total">
                        <span>Total Amount</span>
                        <span>₹{{totalAmount}}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="loading" class="ion-padding">
        <ion-skeleton-text [animated]="true"
            style="width: 100%; height: 250px; border-radius: 0 0 24px 24px; margin: -16px -16px 16px -16px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 40%; height: 24px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 90%; height: 16px; margin-top: 12px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 80%; height: 16px; margin-top: 8px;"></ion-skeleton-text>
    </div>
</ion-content>

<ion-footer class="ion-no-border">
    <ion-toolbar class="ion-padding-horizontal ion-padding-bottom footer-navy">
        <ion-button expand="block" class="book-btn-orange" (click)="placeBooking()">
            Place Rental Booking
        </ion-button>
    </ion-toolbar>
</ion-footer>
