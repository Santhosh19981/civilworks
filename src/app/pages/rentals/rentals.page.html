<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Equipment Rental</ion-title>
    </ion-toolbar>
    <ion-toolbar>
        <ion-searchbar [(ngModel)]="searchQuery" (ionInput)="onSearchChange($event)" placeholder="Search equipment..."
            animated="true">
        </ion-searchbar>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
        <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <!-- Rentals Grid -->
    <div class="rentals-grid" *ngIf="!loading">
        <div class="rental-card fade-in" *ngFor="let rental of filteredRentals" (click)="viewRental(rental.id)">
            <div class="rental-image-container">
                <img [src]="rental.image" [alt]="rental.name">
                <div class="price-badge">₹{{ rental.pricePerDay }}/day</div>
            </div>
            <div class="rental-info">
                <div class="category-tag">{{ rental.category }}</div>
                <h3>{{ rental.name }}</h3>
                <p>{{ rental.description }}</p>
                <ion-button expand="block" fill="outline" class="view-btn">
                    View Details
                </ion-button>
            </div>
        </div>
    </div>

    <!-- Skeleton Loaders -->
    <div class="rentals-grid" *ngIf="loading">
        <div class="skeleton-card" *ngFor="let i of [1,2,3,4]">
            <ion-skeleton-text [animated]="true"
                style="width: 100%; height: 180px; border-radius: 12px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 70%; margin-top: 12px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 90%; margin-top: 8px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true"
                style="width: 100%; height: 44px; margin-top: 16px; border-radius: 10px;"></ion-skeleton-text>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && filteredRentals.length === 0">
        <div class="empty-state-icon">🚜</div>
        <div class="empty-state-title">No Equipment Found</div>
        <div class="empty-state-text">Try adjusting your search</div>
    </div>
</ion-content>
