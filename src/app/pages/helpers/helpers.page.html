<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/home" color="navy"></ion-back-button>
        </ion-buttons>
        <ion-title>Hire Skilled Helpers</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
        <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <div class="helpers-grid" *ngIf="!loading">
        <div class="helper-card scale-in" *ngFor="let helper of helpers" (click)="viewHelper(helper.id)">
            <div class="helper-image-container">
                <img [src]="helper.image" [alt]="helper.name">
                <div class="price-badge">₹{{helper.pricePerDay}}/day</div>
            </div>
            <div class="helper-info">
                <h3>{{helper.name}}</h3>
                <p>{{helper.description}}</p>
                <ion-button expand="block" fill="outline" class="view-btn">
                    View Details
                </ion-button>
            </div>
        </div>
    </div>

    <!-- Skeleton Loader -->
    <div class="helpers-grid" *ngIf="loading">
        <div class="skeleton-card" *ngFor="let i of [1,2,3,4]">
            <ion-skeleton-text [animated]="true"
                style="width: 100%; height: 150px; border-radius: 12px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 70%; margin-top: 12px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true" style="width: 90%; margin-top: 8px;"></ion-skeleton-text>
            <ion-skeleton-text [animated]="true"
                style="width: 100%; height: 36px; margin-top: 16px; border-radius: 8px;"></ion-skeleton-text>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && helpers.length === 0">
        <ion-icon name="people-outline" class="empty-icon"></ion-icon>
        <h3>No Helpers Found</h3>
        <p>We couldn't find any helper services at the moment.</p>
    </div>
</ion-content>
