<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/helpers" color="navy"></ion-back-button>
    </ion-buttons>
    <ion-title>Helper Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="helper" class="fade-in">
    <div class="helper-hero">
      <img [src]="helper.image" [alt]="helper.name">
      <div class="hero-overlay">
        <h1>{{helper.name}}</h1>
        <div class="price-tag">
          <span class="currency">₹</span>
          <span class="amount">{{helper.pricePerDay}}</span>
          <span class="unit">/day per member</span>
        </div>
      </div>
    </div>

    <div class="details-container ion-padding">
      <div class="section">
        <h2 class="section-title">Description</h2>
        <p class="description-text">{{helper.description}}</p>
      </div>

      <div class="section booking-form">
        <h2 class="section-title">Hiring Details</h2>

        <div class="input-group">
          <label>Number of Members</label>
          <div class="members-selector">
            <ion-button fill="clear" (click)="decrementMembers()">
              <ion-icon name="remove-circle-outline"></ion-icon>
            </ion-button>
            <span class="count">{{membersCount}}</span>
            <ion-button fill="clear" (click)="incrementMembers()">
              <ion-icon name="add-circle-outline"></ion-icon>
            </ion-button>
          </div>
        </div>

        <div class="total-section">
          <div class="total-row">
            <span>Price per member</span>
            <span>₹{{helper.pricePerDay}}</span>
          </div>
          <div class="total-row">
            <span>Members</span>
            <span>x {{membersCount}}</span>
          </div>
          <hr>
          <div class="total-row grand-total">
            <span>Total Payable</span>
            <span>₹{{totalAmount}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="ion-padding">
    <ion-skeleton-text [animated]="true"
      style="width: 100%; height: 250px; border-radius: 0 0 24px 24px; margin: -16px -16px 16px -16px;"></ion-skeleton-text>
    <ion-skeleton-text [animated]="true" style="width: 40%; height: 24px;"></ion-skeleton-text>
    <ion-skeleton-text [animated]="true" style="width: 90%; height: 16px; margin-top: 12px;"></ion-skeleton-text>
    <ion-skeleton-text [animated]="true" style="width: 80%; height: 16px; margin-top: 8px;"></ion-skeleton-text>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar class="ion-padding-horizontal ion-padding-bottom">
    <ion-button expand="block" class="book-btn" (click)="placeBooking()">
      Place Booking
    </ion-button>
  </ion-toolbar>
</ion-footer>
